name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "license": HACS only accepts SPDX-recognised licences; this project is
          # deliberately all-rights-reserved (custom repository only).
          # "brands" requires a merged PR against home-assistant/brands (a
          # separate repo, reviewed by HA maintainers) - out of scope for
          # this repo's own CI. hacs/action wants a SPACE-separated list
          # here, not comma-separated - a comma makes the whole string one
          # unmatched token and nothing gets ignored. Topics are already set
          # on the GitHub repo itself, so that check passes on its own now.
          ignore: brands license

  python:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m compileall -q custom_components

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install aiohttp
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tests/test_parsers.py
      - run: python tests/test_extras.py
      - run: node tests/card_render.test.mjs
        env:
          TZ: Europe/London
      - run: node tests/panel_render.test.mjs
        env:
          TZ: Europe/London
