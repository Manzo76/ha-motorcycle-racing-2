# Motorcycle Racing — example dashboard
#
# One tab per series, MotoGP first. Paste the `views:` list into a YAML-mode
# dashboard, or use "Raw configuration editor" on a storage dashboard and
# merge it into an existing dashboard's `views:`.
#
# Each tab uses the bundled `custom:motorcycle-racing-card`, which finds its
# own entities from the `series:` key via the device registry — no need to
# know the exact entity_ids. Add/remove a view block for whichever series you
# have configured (Settings → Devices & services → Add integration →
# Motorcycle Racing, once per series).

views:
  - title: MotoGP
    path: motogp
    icon: mdi:motorbike
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: motogp
            standings_rows: 6
            results_rows: 6

      - type: grid
        cards:
          - type: calendar
            title: MotoGP calendar
            initial_view: listWeek
            entities:
              - calendar.motogp

  - title: Moto2
    path: moto2
    icon: mdi:motorbike
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: moto2
            standings_rows: 6
            results_rows: 6

      - type: grid
        cards:
          - type: calendar
            title: Moto2 calendar
            initial_view: listWeek
            entities:
              - calendar.moto2

  - title: Moto3
    path: moto3
    icon: mdi:motorbike
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: moto3
            standings_rows: 6
            results_rows: 6

      - type: grid
        cards:
          - type: calendar
            title: Moto3 calendar
            initial_view: listWeek
            entities:
              - calendar.moto3

  - title: MotoE
    path: motoe
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: motoe
            standings_rows: 6
            results_rows: 6

      - type: grid
        cards:
          - type: calendar
            title: MotoE calendar
            initial_view: listWeek
            entities:
              - calendar.motoe

  - title: WorldSBK
    path: worldsbk
    icon: mdi:motorbike
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: worldsbk
            accent: "#E4002B"
            standings_rows: 5
            results_rows: 5

      - type: grid
        cards:
          - type: calendar
            title: WorldSBK calendar
            initial_view: listWeek
            entities:
              - calendar.worldsbk

  - title: BSB
    path: bsb
    icon: mdi:motorbike
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: bsb
            accent: "#00843D"
            standings_rows: 5
            results_rows: 5

      - type: grid
        cards:
          - type: calendar
            title: British Superbikes calendar
            initial_view: listWeek
            entities:
              - calendar.bsb

