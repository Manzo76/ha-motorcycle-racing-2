# Motorcycle Racing — example dashboard view
#
# Paste this into a YAML-mode dashboard, or use "Raw configuration editor" on a
# storage dashboard. Entity ids assume a MotoGP entry and a WorldSBK entry; run
# Developer Tools → States and filter on "motorcycle" if yours differ.

views:
  - title: Racing
    path: racing
    icon: mdi:motorbike
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: motogp
            title: MotoGP
            standings_rows: 6
            results_rows: 6

      - type: grid
        cards:
          - type: custom:motorcycle-racing-card
            series: worldsbk
            title: WorldSBK
            accent: "#E4002B"
            standings_rows: 5
            results_rows: 5

      - type: grid
        cards:
          - type: calendar
            title: Race calendar
            initial_view: listWeek
            entities:
              - calendar.motogp
              - calendar.worldsbk

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.motogp_race_weekend
                state: "on"
            card:
              type: markdown
              content: >-
                ## 🏁 {{ state_attr('sensor.motogp_next_race', 'name') }}

                **{{ state_attr('sensor.motogp_next_race', 'circuit') }}** ·
                {{ state_attr('sensor.motogp_next_race', 'country') }}

                Next up: **{{ states('sensor.motogp_next_session') }}** —
                {{ relative_time(states.sensor.motogp_next_session_time.state | as_datetime) }}
                {% set w = state_attr('sensor.motogp_next_session', 'weather') %}
                {% if w %}

                Track {{ w.track }} · Air {{ w.air }} · {{ w.weather }}
                {% endif %}

          - type: entities
            title: Season
            entities:
              - entity: sensor.motogp_season_round
                name: Rounds completed
              - entity: sensor.motogp_rider_standings
                name: Championship leader
              - entity: sensor.motogp_team_standings
                name: Leading team
              - entity: sensor.motogp_last_race
                name: Last winner
              - entity: binary_sensor.motogp_race_day
                name: Race day

